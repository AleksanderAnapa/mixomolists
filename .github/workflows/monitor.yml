name: 5-Min Monitor Final

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pyyaml requests

      - name: Скачать Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R MetaCubeX/mihomo -p "mihomo-linux-amd64*.gz" --clobber
          rm -f *compatible* *go*
          FILE=$(ls mihomo-linux-amd64*.gz | head -n 1)
          gunzip -c "$FILE" > mihomo
          chmod +x mihomo
          rm -f *.gz

      - name: Проверить final.txt
        run: python monitor.py

      - name: Обновить final.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add final.txt fail_counts.json || true
          git commit -m "Monitor update" || exit 0
          git push
