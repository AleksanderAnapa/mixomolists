name: 15-Min Monitor Final

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-repo-sync
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pyyaml requests

      - name: Скачать Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R MetaCubeX/mihomo -p "mihomo-linux-amd64*.gz" --clobber
          rm -f *compatible* *go*
          FILE=$(ls mihomo-linux-amd64*.gz | head -n 1)
          gunzip -c "$FILE" > mihomo
          chmod +x mihomo
          rm -f *.gz

      - name: Проверить final.txt
        run: |
          python -u monitor.py
          rm -f mihomo

      - name: Обновить final.txt
        if: always()
        run: |
          rm -f mihomo mon_*.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add final.txt fail_counts.json || true
          git commit -m "Monitor update" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
