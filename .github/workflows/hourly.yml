name: Hourly Parse and Test

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pyyaml requests

      - name: Скачать Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R MetaCubeX/mihomo -p "mihomo-linux-amd64*.gz" --clobber
          rm -f *compatible* *go*
          FILE=$(ls mihomo-linux-amd64*.gz | head -n 1)
          gunzip -c "$FILE" > mihomo
          chmod +x mihomo
          rm -f *.gz

      - name: Запустить парсинг и тест
        run: python parse_and_test.py

      - name: Сохранить изменения в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add test.txt testing.txt tested.txt final.txt .test_hash fail_counts.json || true
          git commit -m "Hourly update and cleanup test.txt" || exit 0
          git push
