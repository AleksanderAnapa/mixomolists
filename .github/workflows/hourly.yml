name: Hourly Parse and Test

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: proxy-repo-sync
  cancel-in-progress: false

jobs:
  parse_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install pyyaml requests

      - name: Скачать Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R MetaCubeX/mihomo -p "mihomo-linux-amd64*.gz" --clobber
          rm -f *compatible* *go*
          FILE=$(ls mihomo-linux-amd64*.gz | head -n 1)
          gunzip -c "$FILE" > mihomo
          chmod +x mihomo
          rm -f *.gz

      - name: Запустить парсинг и тест
        id: run_script
        run: |
          python -u parse_and_test.py
          rm -f mihomo

      - name: Сохранить прогресс в репозитории
        if: always()
        run: |
          rm -f mihomo mihomo_*.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add test.txt testing.txt tested.txt final.txt debug_log.txt fail_counts.json || true
          git commit -m "Hourly progress update" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Перезапустить если test.txt еще не до конца разобран
        if: always() && steps.run_script.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run hourly.yml --ref ${{ github.ref_name }}
